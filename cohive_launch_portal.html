<p class="font-label-tech text-label-tech text-on-surface-variant mt-xs">Sector 7-G Access Port</p>
</div>
<div class="bg-surface-container/10 backdrop-blur-[40px] border border-primary-fixed-dim/20 rounded-xl p-lg shadow-[0_0_20px_rgba(0,0,0,0.5)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent z-0 pointer-events-none"></div>
<form class="relative z-10 flex flex-col gap-md">
<div class="flex flex-col gap-base relative">
<label class="font-label-tech text-label-tech text-primary-fixed-dim absolute top-3 left-4 transition-all duration-200 pointer-events-none text-xs -translate-y-4 bg-surface px-1" for="email">Comm Link (Email)</label>
<input class="w-full bg-surface-container-high/40 border border-outline-variant/50 rounded-lg px-4 pt-6 pb-2 font-body-md text-on-surface focus:outline-none focus:border-primary-fixed-dim focus:shadow-[0_0_15px_rgba(0,221,221,0.3)] transition-all placeholder-transparent" id="email" placeholder="commander@cohive.space" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
</div>
<div class="flex flex-col gap-base relative">
<label class="font-label-tech text-label-tech text-primary-fixed-dim absolute top-3 left-4 transition-all duration-200 pointer-events-none text-xs -translate-y-4 bg-surface px-1" for="password">Security Code</label>
<input class="w-full bg-surface-container-high/40 border border-outline-variant/50 rounded-lg px-4 pt-6 pb-2 font-body-md text-on-surface focus:outline-none focus:border-secondary focus:shadow-[0_0_15px_rgba(255,170,247,0.3)] transition-all placeholder-transparent" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer hover:text-secondary transition-colors">visibility_off</span>
</div>
<div class="flex justify-between items-center px-xs">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant/50 bg-surface-container-high/40 text-primary-fixed-dim focus:ring-primary-fixed-dim focus:ring-offset-background" type="checkbox"/>
<span class="font-body-md text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Maintain Link</span>
</label>
<a class="font-label-tech text-xs text-secondary hover:text-secondary-fixed transition-colors" href="#">Lost Code?</a>
</div>
<button class="mt-sm w-full py-4 rounded-full bg-gradient-to-r from-primary-fixed-dim to-secondary-container font-headline-md text-headline-md text-on-primary-fixed-variant shadow-lg shadow-primary-fixed-dim/20 hover:shadow-[0_0_25px_rgba(0,221,221,0.5)] hover:scale-[1.02] transition-all duration-300 relative overflow-hidden group" type="button">
<span class="relative z-10 flex items-center justify-center gap-2">
                        Launch
                        <span class="material-symbols-outlined font-bold">rocket_launch</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</form>
<div class="mt-lg pt-md border-t border-outline-variant/20 relative z-10 flex flex-col items-center gap-sm">
<p class="font-body-md text-sm text-on-surface-variant">New Crew Member?</p>
